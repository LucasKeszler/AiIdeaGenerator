<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Idé-generator</title>
    <style>
        :root {
            --bg: #f5f5f4; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
            --user: #d97757; --user-text: #ffffff; --bot: #f5f5f4; --border: #e7e5e4;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1917; --panel: #292524; --text: #f5f5f4; --muted: #a8a29e;
                --user: #c2603f; --user-text: #ffffff; --bot: #3a3532; --border: #44403c;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; justify-content: center; height: 100vh;
        }
        .app {
            width: 100%; max-width: 820px; display: flex; flex-direction: column;
            background: var(--panel); border-left: 1px solid var(--border); border-right: 1px solid var(--border);
        }
        header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
        header h1 { margin: 0; font-size: 1.2rem; }
        header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
        .msg.assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
        .msg.error { align-self: center; color: #dc2626; font-size: 0.9rem; }
        .msg.thinking { color: var(--muted); font-style: italic; }
        .suggestions { display: flex; flex-wrap: wrap; gap: 8px; }
        .suggestions button {
            border: 1px solid var(--border); background: transparent; color: var(--text);
            padding: 8px 12px; border-radius: 999px; cursor: pointer; font-size: 0.9rem;
        }
        .suggestions button:hover { border-color: var(--user); }
        form { display: flex; gap: 8px; padding: 16px 20px; border-top: 1px solid var(--border); }
        textarea {
            flex: 1; resize: none; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font: inherit; min-height: 44px; max-height: 160px;
        }
        form button {
            padding: 0 18px; border: none; border-radius: 10px; background: var(--user); color: var(--user-text);
            font: inherit; cursor: pointer;
        }
        form button:disabled { opacity: 0.5; cursor: default; }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>💡 AI Idé-generator</h1>
        <p>Spørg Claude om idéer til projekter med gratis offentlige API'er</p>
    </header>
    <div id="messages">
        <div class="suggestions" id="suggestions">
            <button>Giv mig idéer til et skoleprojekt</button>
            <button>Hvilke API'er kan jeg bruge til en vejr-app?</button>
            <button>Lav en sjov app der kombinerer to API'er</button>
        </div>
    </div>
    <form id="form">
        <textarea id="input" placeholder="Skriv dit spørgsmål..." rows="1"></textarea>
        <button type="submit" id="send">Send</button>
    </form>
</div>
<script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const history = [];

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    async function send(text) {
        text = text.trim();
        if (!text) return;
        document.getElementById('suggestions')?.remove();
        addMessage('user', text);
        history.push({ role: 'user', content: text });
        input.value = '';
        sendBtn.disabled = true;
        const thinking = addMessage('assistant thinking', 'Claude tænker...');

        try {
            const res = await fetch('/api/v1/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: history })
            });
            const data = await res.json();
            thinking.remove();
            if (!res.ok) {
                history.pop(); // fjern spørgsmålet så man kan prøve igen
                addMessage('error', data.reply || 'Noget gik galt.');
                return;
            }
            history.push({ role: 'assistant', content: data.reply });
            addMessage('assistant', data.reply);
        } catch (e) {
            thinking.remove();
            history.pop();
            addMessage('error', 'Kunne ikke kontakte serveren.');
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    }

    form.addEventListener('submit', e => { e.preventDefault(); send(input.value); });
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
    });
    document.querySelectorAll('#suggestions button').forEach(b =>
        b.addEventListener('click', () => send(b.textContent)));
</script>
</body>
</html>
